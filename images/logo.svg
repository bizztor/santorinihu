<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Santorini Hut — Authentic Greek Food">
  <defs>
    <!-- Curved baselines for the badge text -->
    <path id="arc-top" d="M 90 300 A 210 210 0 0 1 510 300" fill="none"/>
    <path id="arc-bottom" d="M 110 300 A 190 190 0 0 0 490 300" fill="none"/>
    <clipPath id="scene-clip"><circle cx="300" cy="300" r="135"/></clipPath>
  </defs>

  <!-- Outer ring -->
  <circle cx="300" cy="300" r="290" fill="#ffffff"/>
  <circle cx="300" cy="300" r="288" fill="none" stroke="#2f4a63" stroke-width="14"/>
  <circle cx="300" cy="300" r="232" fill="none" stroke="#2f4a63" stroke-width="9"/>

  <!-- Arched brand text -->
  <text font-family="'Poppins','Montserrat',sans-serif" font-weight="800" letter-spacing="6" fill="#3b82f6" font-size="62">
    <textPath href="#arc-top" startOffset="50%" text-anchor="middle">SANTORINI HUT</textPath>
  </text>
  <text font-family="'Poppins','Montserrat',sans-serif" font-weight="700" letter-spacing="5" fill="#2f4a63" font-size="34">
    <textPath href="#arc-bottom" startOffset="50%" text-anchor="middle">AUTHENTIC GREEK FOOD</textPath>
  </text>

  <!-- Side dots -->
  <circle cx="120" cy="300" r="12" fill="#2f4a63"/>
  <circle cx="480" cy="300" r="12" fill="#2f4a63"/>

  <!-- Central Santorini scene -->
  <circle cx="300" cy="300" r="135" fill="#cfe8fb"/>
  <g clip-path="url(#scene-clip)">
    <rect x="165" y="300" width="270" height="135" fill="#dff0d0"/>
    <rect x="165" y="372" width="270" height="63" fill="#f4d63a"/>
    <!-- rolling hill -->
    <path d="M165 360 Q 235 330 320 358 T 435 360 V435 H165 Z" fill="#e9c52f" opacity="0.55"/>
    <!-- bushes -->
    <ellipse cx="195" cy="352" rx="34" ry="24" fill="#7cc242"/>
    <ellipse cx="408" cy="352" rx="32" ry="22" fill="#7cc242"/>
    <!-- domed church -->
    <path d="M268 300 a40 40 0 0 1 80 0 Z" fill="#3b82f6" stroke="#2f4a63" stroke-width="4"/>
    <rect x="268" y="298" width="80" height="60" fill="#ffffff" stroke="#2f4a63" stroke-width="4"/>
    <rect x="300" y="250" width="16" height="22" fill="#ffffff" stroke="#2f4a63" stroke-width="3"/>
    <!-- left white house -->
    <path d="M205 312 q35 -34 70 0 V372 H205 Z" fill="#ffffff" stroke="#2f4a63" stroke-width="4"/>
    <rect x="222" y="330" width="16" height="26" rx="8" fill="#3b82f6" stroke="#2f4a63" stroke-width="3"/>
    <rect x="246" y="330" width="16" height="26" rx="8" fill="#3b82f6" stroke="#2f4a63" stroke-width="3"/>
    <!-- arched arcade -->
    <rect x="205" y="358" width="200" height="60" fill="#ffffff" stroke="#2f4a63" stroke-width="4"/>
    <path d="M222 418 v-26 a14 14 0 0 1 28 0 v26 Z" fill="#3b82f6" stroke="#2f4a63" stroke-width="3"/>
    <path d="M286 418 v-26 a14 14 0 0 1 28 0 v26 Z" fill="#3b82f6" stroke="#2f4a63" stroke-width="3"/>
    <path d="M350 418 v-26 a14 14 0 0 1 28 0 v26 Z" fill="#3b82f6" stroke="#2f4a63" stroke-width="3"/>
    <!-- cloud -->
    <g fill="#ffffff" stroke="#cdd9e3" stroke-width="2">
      <ellipse cx="372" cy="232" rx="26" ry="15"/>
      <ellipse cx="392" cy="238" rx="18" ry="12"/>
    </g>
  </g>
</svg>
